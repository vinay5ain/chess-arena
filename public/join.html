<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join / Login Tournament</title>
  <style>
    :root {
      --main-green: #28a745;
      --light-green: #d4edda;
      --dark-green: #215e21;
      --white: #ffffff;
      --error-red: #c82333;
      accent-color: var(--main-green);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f9fff9, #e9f7e9);
      background-blend-mode: lighten;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--dark-green);
    }

    .container {
      background: var(--white);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 128, 0, 0.2);
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.6s ease-out both;
      backface-visibility: hidden;
      will-change: transform, opacity;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-variant: small-caps;
    }

    .tab-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tab-buttons button {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: var(--light-green);
      color: var(--dark-green);
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .tab-buttons button:hover {
      transform: scale(1.02);
    }

    .tab-buttons button.active {
      background: var(--main-green);
      color: var(--white);
    }

    .form-section {
      display: none;
      animation: fadeIn 0.4s ease-in;
    }

    .form-section.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
      transition: border-color 0.3s ease, background 0.2s;
      background-clip: padding-box;
    }

    input:focus, select:focus {
      border-color: var(--main-green);
      outline: none;
      background: #f0fff0;
    }

    input::placeholder {
      color: #999;
    }

    .btn {
      width: 100%;
      margin-top: 24px;
      background-color: var(--main-green);
      color: var(--white);
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.2s ease;
      will-change: transform;
    }

    .btn:hover {
      background-color: #218838;
      transform: scale(1.03);
    }

    .hidden {
      display: none;
    }

    .error {
      color: var(--error-red);
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }

    @media (max-height: 600px) {
      body {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="tab-buttons">
      <button id="tab-join" class="active">Join</button>
      <button id="tab-login">Login</button>
    </div>

    <!-- JOIN FORM -->
    <div id="section-join" class="form-section active">
      <h2>Join Tournament</h2>
      <form id="joinForm">
        <label>Player Name:</label>
        <input type="text" id="playerName" placeholder="e.g. Anil Sharma" required />

        <label>Email:</label>
        <input type="text" id="email" placeholder="e.g. anil@gmail.com" required />

        <label>Tournament Name:</label>
        <input type="text" id="tournamentName" required />

        <label>Tournament Type:</label>
        <select id="tournamentType" required>
          <option value="public">Public</option>
          <option value="private">Private</option>
        </select>

        <div id="entryFeeSection">
          <label>Entry Fee:</label>
          <input type="number" id="entryFee" placeholder="e.g. 100" />
        </div>

        <div id="accessKeySection" class="hidden">
          <label>Access Key:</label>
          <input type="text" id="accessKey" />
        </div>

        <button type="submit" class="btn">Join Tournament</button>
        <div id="join-error" class="error"></div>
      </form>
    </div>

    <!-- LOGIN FORM -->
    <div id="section-login" class="form-section">
      <h2>Player Login</h2>
      <form id="loginForm">
        <label>Player Name:</label>
        <input type="text" id="loginName" required />

        <label>Player ID:</label>
        <input type="text" id="loginId" required />

        <button type="submit" class="btn">Login</button>
        <div id="login-error" class="error"></div>
      </form>
    </div>
  </div>

  <script>
    const tabJoin = document.getElementById('tab-join');
    const tabLogin = document.getElementById('tab-login');
    const secJoin = document.getElementById('section-join');
    const secLogin = document.getElementById('section-login');

    tabJoin.onclick = () => {
      tabJoin.classList.add('active');
      tabLogin.classList.remove('active');
      secJoin.classList.add('active');
      secLogin.classList.remove('active');
    };

    tabLogin.onclick = () => {
      tabLogin.classList.add('active');
      tabJoin.classList.remove('active');
      secLogin.classList.add('active');
      secJoin.classList.remove('active');
    };

    const typeSelect = document.getElementById('tournamentType');
    const accessKeySection = document.getElementById('accessKeySection');
    const entryFeeSection = document.getElementById('entryFeeSection');
    typeSelect.addEventListener('change', () => {
      const isPrivate = typeSelect.value === 'private';
      accessKeySection.classList.toggle('hidden', !isPrivate);
      entryFeeSection.classList.toggle('hidden', isPrivate);
    });

    document.getElementById('joinForm').addEventListener('submit', async e => {
      e.preventDefault();
      const errorEl = document.getElementById('join-error');
      errorEl.textContent = '';

      const playerName = document.getElementById('playerName').value.trim();
      let email = document.getElementById('email').value.trim();
      const tournamentName = document.getElementById('tournamentName').value.trim();
      const isPrivate = typeSelect.value === 'private';
      const accessKey = document.getElementById('accessKey').value.trim();

      if (!email.includes('@')) email += '@gmail.com';

      try {
        const resp = await fetch('/api/tournament/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerName, email, tournamentName, isPrivate, accessKey })
        });

        const data = await resp.json();
        if (!resp.ok) throw new Error(data.message || resp.statusText);

        alert('✅ Joined! Your Player ID: ' + data.player.playerId);
        localStorage.setItem('playerId', data.player.playerId);
        localStorage.setItem('playerName', data.player.name);  // ✅ fixed
        window.location.href = 'profile.html';
      } catch (err) {
        errorEl.textContent = '❌ ' + err.message;
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const errorEl = document.getElementById('login-error');
      errorEl.textContent = '';

      const loginName = document.getElementById('loginName').value.trim();
      const loginId = document.getElementById('loginId').value.trim();

      try {
        const resp = await fetch(`/api/player/profile/${encodeURIComponent(loginId)}`);
        const player = await resp.json();

        if (!resp.ok || !player.name) {
          throw new Error(player.message || 'Player not found');
        }

        if (typeof player.name !== 'string' || player.name.toLowerCase() !== loginName.toLowerCase()) {
          throw new Error('Name and ID do not match');
        }

        localStorage.setItem('playerId', player.playerId);
        localStorage.setItem('playerName', player.name);  // ✅ fixed
        alert('✅ Logged in!');
        window.location.href = 'profile.html';
      } catch (err) {
        errorEl.textContent = '❌ ' + err.message;
      }
    });
  </script>
</body>
</html>
