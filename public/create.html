<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Tournament</title>
  <link rel="stylesheet" href="create.css" />
</head>
<body>

  <header>
    <h1>Create a New Tournament</h1>
    <button class="login-btn" onclick="openLogin()">Login</button>
  </header>

  <main>
    <form onsubmit="handleCreate(event)">
      <label for="tournament-name">Tournament Name:</label>
      <input type="text" id="tournament-name" required />

      <label for="password">Tournament Password:</label>
      <input type="password" id="password" required />

      <label for="tournament-type">Tournament Type:</label>
      <select id="tournament-type">
        <option value="public">Public</option>
        <option value="private">Private</option>
      </select>

      <div id="private-fields" style="display:none;">
        <label for="access-key">Access Key:</label>
        <input type="text" id="access-key" />
      </div>

      <div id="public-fields">
        <label for="entry-fee">Entry Fee:</label>
        <input type="number" id="entry-fee" />
      </div>

      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="online">Online</option>
        <option value="offline">Offline</option>
      </select>

      <button type="submit" class="create-btn">Create Tournament</button>
    </form>
  </main>

  <!-- Login Modal -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <span class="close" onclick="closeLogin()">&times;</span>
      <h3>Tournament Admin Login</h3>
      <label for="login-name">Tournament Name:</label>
      <input type="text" id="login-name" />
      <label for="login-pass">Tournament Password:</label>
      <input type="password" id="login-pass" />
      <button onclick="checkLogin()">Login</button>
    </div>
  </div>

  <script src="create.js"></script>
</body>
</html>
