<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel – Chess Tournament</title>
 <style>
  :root {
    --primary: #2e7d32;   /* chess green */
    --danger: #c0392b;
    --success: #d4af37;   /* gold */
    --warning: #f39c12;
    --bg: #fdfcf8;        /* soft cream */
    --text-dark: #222;
    --shadow: rgba(0, 0, 0, 0.1);
  }

  * {
    box-sizing: border-box;
    transition: all 0.2s ease-in-out;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--text-dark);
  }

  header {
    background: linear-gradient(90deg, #1b1b1b, #333);
    color: #fff;
    padding: 1.25rem;
    text-align: center;
    box-shadow: 0 4px 12px var(--shadow);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  nav {
    background: white;
    display: flex;
    justify-content: center;
    padding: 0.75rem 0;
    border-bottom: 2px solid #ccc;
    position: sticky;
    top: 70px;
    z-index: 9;
  }

  nav > a {
    margin: 0 15px;
    color: var(--primary);
    text-decoration: none;
    font-weight: bold;
    padding: 8px 14px;
    border-radius: 6px;
    transition: 0.2s;
  }

  nav > a:hover {
    background: var(--primary);
    color: white;
  }

  main {
    padding: 2rem;
    max-width: 1100px;
    margin: auto;
  }

  .section + .section {
    margin-top: 3rem;
  }

  .section h2 {
    margin-bottom: 1rem;
    border-left: 5px solid var(--primary);
    padding-left: 0.75rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 0 8px var(--shadow);
    border-radius: 6px;
    overflow: hidden;
  }

  table th, table td {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1px solid #eee;
  }

  table th {
    background: #f8f8f8;
    font-weight: bold;
    color: #2e2e2e;
  }

  tr:hover {
    background: #f1f1f1;
    transform: scale(1.005);
  }

  .tabs {
    display: flex;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .tabs button {
    padding: 10px 16px;
    border: none;
    background: #e0e0e0;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 6px var(--shadow);
  }

  .tabs button:hover {
    background: var(--primary);
    color: white;
    transform: translateY(-2px);
  }

  .tabs button.active {
    background: var(--primary);
    color: white;
  }

  .match-list .match-item {
    background: white;
    margin-bottom: 12px;
    padding: 14px 18px;
    box-shadow: 0 3px 6px var(--shadow);
    border-left: 5px solid var(--primary);
    border-radius: 6px;
  }

  .input-group {
    display: flex;
    align-items: center;
    margin-bottom: 1rem;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .input-group label {
    font-weight: bold;
    min-width: 100px;
  }

  input[type="text"],
  input[type="number"] {
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    flex: 1;
    font-size: 15px;
  }

  button.btn {
    padding: 10px 14px;
    border: none;
    color: white;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .btn-success { background: var(--success); color: #000; }
  .btn-primary { background: var(--primary); }
  .btn-warning { background: var(--warning); }
  .btn-danger  { background: var(--danger); }

  button.btn:hover {
    transform: scale(1.05);
    opacity: 0.92;
  }

  select {
    padding: 8px 10px;
    margin: 0 5px;
    border-radius: 5px;
    border: 1px solid #aaa;
  }

  @media (max-width: 600px) {
    .input-group {
      flex-direction: column;
      align-items: stretch;
    }
    nav {
      flex-direction: column;
    }
  }

  ::selection {
    background: #c8e6c9;
    color: #1b5e20;
  }
</style>
</head>
<body>

<header>
  <h1>Admin Panel – Chess Tournament</h1>
</header>

<nav>
  <a href="#leaderboard">Leaderboard</a>
  <a href="#matches">Matches</a>
  <a href="#controls">Tournament Control</a>
  <a href="#players">Player Management</a>
</nav>

<main>
  <!-- 🏆 Leaderboard -->
  <section id="leaderboard" class="section">
    <h2>🏆 Leaderboard</h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Player ID</th>
          <th>Wins</th>
          <th>Losses</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </section>

  <!-- 🎯 Matches -->
  <section id="matches" class="section">
    <h2>🎯 Matches</h2>
    <div class="tabs">
      <button class="active" onclick="switchTab('live', event)">🔴 Live</button>
      <button onclick="switchTab('upcoming', event)">🟡 Upcoming</button>
      <button onclick="switchTab('past', event)">⚫ Past</button>
    </div>
    <div id="matchContent" class="match-list"></div>
  </section>

  <!-- ⚙️ Controls -->
  <section id="controls" class="section">
    <h2>⚙️ Tournament Control</h2>
    <div class="input-group">
      <label>Set Rounds:</label>
      <input type="number" id="rounds" min="1" />
      <button class="btn btn-success" onclick="setRounds()">Set</button>
    </div>
    <div class="input-group">
      <label>Matchmaking:</label>
      <button class="btn btn-primary" onclick="manualMatchmaking()">Manual</button>
      <button class="btn btn-warning" onclick="autoMatchmaking()">Auto</button>
    </div>
  </section>

  <!-- 👥 Player Management -->
  <section id="players" class="section">
    <h2>👥 Player Management</h2>
    <div class="input-group">
      <label>Player ID:</label>
      <input type="text" id="searchPlayer" placeholder="Enter player ID" />
      <button class="btn btn-danger" onclick="disqualifyPlayer()">🚫 Disqualify</button>
      <button class="btn btn-danger" onclick="removePoints()">➖ Remove Points</button>
    </div>
    <hr />
    <div class="input-group">
      <label>Add Player (Name):</label>
      <input type="text" id="newPlayerName" placeholder="Enter player name" />
      <button class="btn btn-success" onclick="addPlayer()">➕ Add Player</button>
    </div>
  </section>
</main>

<script>
  const BASE_URL = 'http://localhost:5000';
  const tournamentId = localStorage.getItem('tournamentId');

  if (!tournamentId) {
    alert('Please login first.');
    window.location.href = 'create.html';
  } else {
    loadLeaderboard();
    switchTab('live', { target: document.querySelector('.tabs button:nth-child(1)') });
  }

  async function loadLeaderboard() {
    try {
      const res = await fetch(`${BASE_URL}/api/admin/leaderboard/${tournamentId}`);
      const data = await res.json();
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';
      data.forEach((p, i) => {
        tbody.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td>${p.name}</td>
            <td>${p.playerId}</td>
            <td>${p.wins}</td>
            <td>${p.losses}</td>
            <td>${p.points}</td>
          </tr>`;
      });
    } catch (err) {
      console.error('Leaderboard load error:', err);
    }
  }

  async function switchTab(tab, event) {
    document.querySelectorAll('.tabs button').forEach(btn => btn.classList.remove('active'));
    if (event?.target) event.target.classList.add('active');

    const container = document.getElementById('matchContent');
    container.innerHTML = `<div class="match-item">Loading ${tab} matches...</div>`;

    try {
      const res = await fetch(`${BASE_URL}/api/matches/${tab}/${tournamentId}`);
      const matches = await res.json();
      container.innerHTML = '';
      if (matches.length === 0) {
        container.innerHTML = '<div class="match-item">No matches found.</div>';
      }
      for (const m of matches) {
        let roundDisplay = '';
        if (m.round !== undefined && m.round !== null) {
          roundDisplay = ` (Round: ${String(m.round).toUpperCase()})`;
        } else if (tab === 'upcoming') {
          roundDisplay = ` (Round: N/A)`;
        }
        let html = `${m.player1} vs ${m.player2}${roundDisplay} - ${m.status}`;
        if (tab === 'live') {
          html += `
            <br />
            <label>Winner:</label>
            <select id="win-${m._id}">
              <option value="${m.player1}">${m.player1}</option>
              <option value="${m.player2}">${m.player2}</option>
            </select>
            <button onclick="setWinner('${m._id}')">Set Winner</button>`;
        }
        if (tab === 'past' && m.winner) {
          html += `<br /><strong>Winner:</strong> ${m.winner}`;
        }
        container.innerHTML += `<div class="match-item">${html}</div>`;
      }
    } catch (err) {
      container.innerHTML = '<div class="match-item">Error loading matches.</div>';
    }
  }

  async function setRounds() {
    const rounds = parseInt(document.getElementById('rounds').value);
    if (!rounds || rounds < 1) return alert('Enter valid round number.');
    try {
      const res = await fetch(`${BASE_URL}/api/admin/rounds/${tournamentId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rounds })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      alert('✅ Rounds set successfully.');
    } catch (err) {
      alert('❌ ' + err.message);
    }
  }

  async function autoMatchmaking() {
    try {
      const res = await fetch(`${BASE_URL}/api/admin/auto-match/${tournamentId}`, {
        method: 'POST'
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      alert('✅ Auto matches created.');
      switchTab('live', { target: document.querySelector('.tabs button:nth-child(1)') });
    } catch (err) {
      alert('❌ ' + err.message);
    }
  }

  async function manualMatchmaking() {
    const player1 = prompt('Enter Player 1 name');
    const player2 = prompt('Enter Player 2 name');
    const round = parseInt(prompt('Enter Round number'));
    const time = new Date().toISOString();

    try {
      const res = await fetch(`${BASE_URL}/api/admin/manual-match`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tournamentId, player1, player2, round, scheduledTime: time })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      alert('✅ Manual match created.');
      switchTab('upcoming', { target: document.querySelector('.tabs button:nth-child(2)') });
    } catch (err) {
      alert('❌ ' + err.message);
    }
  }

  async function setWinner(matchId) {
    const winner = document.getElementById(`win-${matchId}`).value;
    try {
      const res = await fetch(`${BASE_URL}/api/admin/set-winner/${matchId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ winner })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      alert('✅ Winner set.');
      switchTab('live', { target: document.querySelector('.tabs button:nth-child(1)') });
      loadLeaderboard();
    } catch (err) {
      alert('❌ ' + err.message);
    }
  }

  async function disqualifyPlayer() {
    const playerId = document.getElementById('searchPlayer').value.trim();
    if (!playerId) return alert('Enter player ID');
    try {
      await fetch(`${BASE_URL}/api/player/disqualify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId })
      });
      alert('🚫 Player disqualified');
      loadLeaderboard();
    } catch (err) {
      alert('Disqualification failed.');
    }
  }

  async function removePoints() {
    const playerId = document.getElementById('searchPlayer').value.trim();
    if (!playerId) return alert('Enter player ID');
    try {
      await fetch(`${BASE_URL}/api/player/updatePoints`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId, points: -1 })
      });
      alert('➖ 1 point removed');
      loadLeaderboard();
    } catch (err) {
      alert('Point update failed.');
    }
  }

  async function addPlayer() {
    const playerName = document.getElementById('newPlayerName').value.trim();
    if (!playerName) return alert('Enter player name');
    try {
      await fetch(`${BASE_URL}/api/player/add`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tournamentId, playerName })
      });
      alert('✅ Player added');
      document.getElementById('newPlayerName').value = '';
      loadLeaderboard();
    } catch (err) {
      alert('Add player failed.');
    }
  }
</script>

</body>
</html>
